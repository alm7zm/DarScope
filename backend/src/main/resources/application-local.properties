# Run with: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
# H2 saved to a file, backend/data/darscope.mv.db, so changes stay after a restart. Nothing to
# install. Delete the backend/data folder to start again from the 8 starting properties.
spring.datasource.url=jdbc:h2:file:./data/darscope;AUTO_SERVER=TRUE

# Both scripts are safe to run at every start: the table is created only if it is missing, and
# the starting properties go only into an empty table.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data-once.sql
