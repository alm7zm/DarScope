spring.application.name=darscope

# The React app's dev server forwards /api to this port (frontend/vite.config.js). Keep it 8080.
server.port=8080

# backend/.env holds the Supabase connection for the supabase profile. It is git-ignored and
# optional: without it the server runs on H2.
spring.config.import=optional:file:.env[.properties]

# Default profile: H2, in memory, inside the server. Spring runs schema.sql and then data.sql at
# every start, so the app always starts from the 8 properties.
spring.datasource.url=jdbc:h2:mem:darscope;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.encoding=UTF-8

# JSON reading. Jackson 3 rounds 620.7 down to 620 by default: refuse it, since every number in
# a property is a whole number (FR-ADD-12). Jackson 3 also refuses a record with an amenity left
# out; read a missing or null amenity as false instead, as docs/backend-plan.md section 4 says.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# http://localhost:8080/h2-console  (JDBC URL jdbc:h2:mem:darscope, user sa, no password)
spring.h2.console.enabled=true
