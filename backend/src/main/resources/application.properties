spring.application.name=darscope

# The React app's dev server forwards /api to this port (frontend/vite.config.js). Keep it 8080.
server.port=8080

# backend/.env holds the Supabase connection for the supabase profile. It is git-ignored and
# optional: without it the server runs on H2.
spring.config.import=optional:file:.env[.properties]

# Default profile: H2, in memory, inside the server. Spring runs schema.sql and then data.sql at
# every start, so the app always starts from the 8 properties.
spring.datasource.url=jdbc:h2:mem:darscope;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.encoding=UTF-8

# http://localhost:8080/h2-console  (JDBC URL jdbc:h2:mem:darscope, user sa, no password)
spring.h2.console.enabled=true
