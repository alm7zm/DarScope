# Run with: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=supabase
# The three values come from backend/.env (docs/backend-plan.md, section 7).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Supabase's session pooler limits connections on the free plan, and the demo needs few.
spring.datasource.hikari.maximum-pool-size=3

# Spring sets up the table itself on every start, and both scripts are safe to run again:
# the table is created only if it is missing, and the 8 starting properties are inserted only
# into an empty table. So a property added in the app stays after a restart.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:supabase/security.sql
spring.sql.init.data-locations=classpath:data-once.sql

spring.h2.console.enabled=false
